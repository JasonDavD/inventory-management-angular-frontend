<nav class="bg-[#1B2A4A] border-b border-[rgba(91,155,213,0.15)] sticky top-0 z-50">
  <div class="h-[60px] px-8 max-w-[1400px] mx-auto flex items-center justify-between">

    <!-- Logo -->
    <a routerLink="/home" class="flex items-center gap-2.5 no-underline shrink-0">
      <div class="w-8 h-8 bg-[#2D4A8A] rounded-lg flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EEF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <div class="text-[13px] font-semibold text-[#E8EEF8] leading-tight">Distribuidora Andina</div>
        <div class="text-[10px] text-[#5B9BD5] uppercase tracking-wider">S.A.C.</div>
      </div>
    </a>

    <!-- Nav links -->
    <ul class="flex items-center gap-0.5 ml-8 list-none p-0 m-0">
      <li>
        <a routerLink="/home" routerLinkActive="text-[#E8EEF8]"
           class="px-3.5 py-2 rounded-lg text-[13px] font-medium text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
          Inicio
        </a>
      </li>
      <li>
        <a routerLink="/almacenes" routerLinkActive="text-[#E8EEF8]"
           class="px-3.5 py-2 rounded-lg text-[13px] font-medium text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
          Almacenes
        </a>
      </li>

      <!-- Dropdown Mantenimientos -->
      <li class="relative">
        <button (click)="toggleMenu($event)"
                class="px-3.5 py-2 rounded-lg text-[13px] font-medium text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] transition-colors flex items-center gap-1.5 border-none bg-transparent cursor-pointer">
          Mantenimientos
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        @if (menuAbierto()) {
          <ul class="absolute top-full left-0 mt-1.5 bg-[#1E3155] border border-[rgba(91,155,213,0.2)] rounded-xl p-1.5 min-w-[180px] list-none shadow-lg z-50">
            <li>
              <a routerLink="/categorias" (click)="cerrarMenu()"
                 class="flex items-center px-3.5 py-2 rounded-lg text-[13px] text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
                Categorías
              </a>
            </li>
            <li>
              <a routerLink="/unidades" (click)="cerrarMenu()"
                 class="flex items-center px-3.5 py-2 rounded-lg text-[13px] text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
                Unidades
              </a>
            </li>
            <li>
              <a routerLink="/productos" (click)="cerrarMenu()"
                 class="flex items-center px-3.5 py-2 rounded-lg text-[13px] text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
                Productos
              </a>
            </li>
            @if (isAdmin()) {
              <li><hr class="border-[rgba(91,155,213,0.15)] my-1"></li>
              <li>
                <a routerLink="/usuarios" (click)="cerrarMenu()"
                   class="flex items-center px-3.5 py-2 rounded-lg text-[13px] text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
                  Usuarios
                </a>
              </li>
            }
          </ul>
        }
      </li>

      <li>
        <a routerLink="/inventario" routerLinkActive="text-[#E8EEF8]"
           class="px-3.5 py-2 rounded-lg text-[13px] font-medium text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
          Inventario
        </a>
      </li>
      <li>
        <a routerLink="/movimientos" routerLinkActive="text-[#E8EEF8]"
           class="px-3.5 py-2 rounded-lg text-[13px] font-medium text-[#8FA8D0] hover:text-[#E8EEF8] hover:bg-[rgba(91,155,213,0.1)] no-underline transition-colors">
          Transacciones
        </a>
      </li>
    </ul>

    <!-- Usuario + logout -->
    <div class="flex items-center gap-3.5 shrink-0 ml-auto">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-[#2D4A8A] rounded-full flex items-center justify-center shrink-0">
          <span class="text-[11px] font-semibold text-[#E8EEF8]">{{ iniciales }}</span>
        </div>
        <div class="hidden sm:block">
          <div class="text-[13px] font-medium text-[#E8EEF8] leading-tight">{{ nombreCompleto }}</div>
          <div class="text-[11px] text-[#5B9BD5] uppercase tracking-wider">{{ rol }}</div>
        </div>
      </div>
      <button (click)="logout()"
              class="text-[13px] text-[#8FA8D0] border border-[rgba(91,155,213,0.3)] rounded-md px-3.5 py-1.5 hover:text-[#E8EEF8] hover:border-[rgba(91,155,213,0.6)] transition-colors bg-transparent cursor-pointer">
        Salir
      </button>
    </div>

  </div>
</nav>
